  rationale: Three structural edit regressions hit the same mechanism on 2026-10-26. An insert nearly overwrote an existing row in message:assistant-msg-4be3cf64-7304-4f10-b79c-6d047a32c5e3. Repeated inserts shifted a daily summary formula range until it was fixed in message:assistant-msg-1475020a-bcd2-405f-9e8a-af71eced599f. Hiding a wide column range made a chart invisible in message:assistant-msg-dc5eb5f6-c9b6-41ae-9247-54d96d6d544d, and the layout was restored only after the user specified the visible columns in message:9ad53e7-9996-4239-bc74-1e93065fe8e9. Skill search found no skill covering pre-change mapping and post-change verification, and the system documents skill only states the general rule to preserve formulas without the map, insert, hide and recheck method. This skill adds exactly that method. Other candidates were rejected on restraint grounds. The single cigarette log inference was corrected in conversation and is already a stated boundary in memory and alignment. The mail rule about closing an unsubscribe as monthly cleanup alone is already covered by the managed browser_login_fallback skill inside its measurement window until 2026-11-24. The deterministic handoff suppression candidates are objective loop policy and trigger cadence, out of scope for a skill. Only two managed learned skills are active, so no consolidation is triggered.
