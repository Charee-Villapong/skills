name: bulk_cleanup_count_reconciliation
title: Bulk cleanup count reconciliation
description: Reconcile bulk cleanup counts before reporting so a report shows only what this run newly changed, when you trash or archive many mail messages or Drive files at once.
category: Work and knowledge
include_in_prompt: false
skill_improvement:
  managed: true
  status: active
