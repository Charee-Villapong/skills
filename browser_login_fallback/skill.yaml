  rationale: 'The Offers unsubscribe task showed the loop this skill stops: the assistant announced a Google login card, the user could not find it, the assistant repeated re-issue promises, then prematurely switched to monthly cleanup in message a384fd06, the user corrected that in message 1d628908 to keep the unsubscribe request, and success came only in message 4d358967 through the user''s own phone browser. The same packet lists four login.advance tool failures and the alignment synthesis records bitFlyer login blocked by a bot check with user device login as the fallback, so the barrier pattern recurs across sites rather than being one site quirk. Skill search found no existing skill covering this fallback, and the Gmail and 1Password connector docs cover operations only, not the retry and fallback method. The Fantia count error is deliberately not re-proposed because the managed bulk_cleanup_count_reconciliation skill already covers it and remains inside its measurement window until 2026-11-23. The deterministic handoff suppression candidates are policy and trigger cadence, out of scope for a skill, and only one managed learned skill exists, so no consolidation is triggered.'
